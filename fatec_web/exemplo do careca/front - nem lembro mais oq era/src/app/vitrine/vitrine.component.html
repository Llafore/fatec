<h4>{{mensagem}}</h4>

<h3 class="produtos" *ngIf="lista.length<=0">
não existem produtos na vitrine</h3>

<div *ngFor="let item of lista">
<h4>{{item.nome}}</h4>
    <img src="./assets/{{item.codigo}}.jpg"
    width="150px"><br>
    {{item.descritivo}}
    <br><br>
    R$ {{item.valor}}
    <button (click)="verDetalhe(item)">Ver Mais</button>
    <button *ngIf="item.quantidade>0">Comprar</button>
</div>
